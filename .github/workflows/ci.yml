name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  run-checks:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: ["22", "24"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run typecheck

      - name: Compile typescript
        run: npm run build

      - name: Run eslint
        run: npm run lint

      - name: Run tests
        run: npm run test
